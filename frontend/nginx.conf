# UniAssist UI: serves the built SPA and proxies /api/ to the FastAPI backend.
server {
    # IPv4 only: an IPv6 listen fails to start on hosts where IPv6 is disabled.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Documents are uploaded through /api/ingest; the backend caps them at 25 MB.
    client_max_body_size 30m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /api/ask -> http://api:8000/ask (prefix stripped, query string kept).
    # The upstream is resolved per request through Docker's DNS, so this container starts
    # even when the api container is not up yet; requests then return 502 until it is.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A local language model can take 5-15 s per answer, ingestion longer.
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Fingerprinted build output never changes, so it can be cached for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # History fallback: client-side routes such as /audit/a91c03fe get index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
