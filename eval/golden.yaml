- id: VC1
  bucket: versions_conflicts
  question: "What is the minimum attendance required to sit end-semester exams?"
  as_of_date: "2026-07-15"
  expected_answer_type: retrieved_fact
  expected_facts: ["75"]
  expected_sources: ["ACAD-REG-2024#7.2"]
  expected_upcoming: ["ACAD-2026-08"]
  reference: "On 15 July 2026: 75% (ACAD-REG-2024 §7.2). Upcoming: ACAD-2026-08 raises it to 80% from 1 August 2026."
  difficulty: medium
  tags: [as_of, version, attendance]

- id: VC2
  bucket: versions_conflicts
  question: "Which rule sets the minimum attendance now, the regulations or the new circular?"
  as_of_date: "2026-10-06"
  expected_answer_type: retrieved_fact
  expected_facts: ["80"]
  expected_sources: ["ACAD-2026-08#1"]
  expected_conflict: step2_supersession
  reference: "The circular ACAD-2026-08 (80%, from 1 August 2026) replaces clause 7.2 of the regulations (75%): resolved by supersession."
  difficulty: medium
  tags: [conflict, supersession, attendance]

- id: VC3
  bucket: versions_conflicts
  question: "Is 65% attendance enough if I have a medical certificate?"
  as_of_date: "2026-10-06"
  expected_answer_type: retrieved_fact
  expected_facts: ["80"]
  forbidden_facts: ["yes, 65"]
  expected_sources: ["ACAD-2026-08#1", "ACAD-2026-08#2", "ACAD-REG-2024#7.3"]
  reference: "No. The minimum is 80% (ACAD-2026-08 §1); medical condonation (§7.3) covers a shortage of at most 10%, so 65% is not enough. The help-desk FAQ's 'yes' is outdated and lower in authority."
