# UniAssist golden evaluation set (guide §7). 37 original items (eval/dataset.yaml, ids kept) + 105 new ones.
# Every expected value was checked against the documents and the synthetic CSVs: run `uv run python eval/verify_golden.py`.
#
# Corpus state assumed: data/corpus/documents (+ the demo circular ACAD-2026-08: 80% from 2026-08-01, replaces
# ACAD-REG-2024 §7.2; run_eval ingests it in setup). HOSTEL-NOTICE-2025 is a scanned page: it is indexed only when
# OCR (tesseract) is available, so the two items that need it declare `requires_docs` and are skipped otherwise.
#
# Item schema (all fields optional except id, bucket, question):
#   student_id            sent as X-Student-Id
#   as_of_date            default 2026-10-06
#   expected_answer_type  one type; or expected_answer_type_in: [allowed types]
#   expected_facts        each must appear in answer + explanation. Numeric facts are compared as numbers
#                         (80 == 80.00 == "80%", 55000 == "55,000"); ISO dates match any written form ("1 August 2026").
#                         Other facts: case-insensitive substring.
#   expected_regex        each regex must match the normalised (lower-case) answer + explanation
#   forbidden_facts       none may appear (same matching as expected_facts)
#   expected_sources      doc_id#section the answer should cite (citation accuracy) and retrieve (hit@k);
#                         "doc#*" = any section of that document, "doc#None" = the document header chunk
#   forbidden_sources     doc_ids that must never be cited
#   expected_tool         {name, input?, output}: some invocation of `name` whose input/output contain these values
#                         (exact; floats ±1e-6)
#   expected_tools        list of the same, all required
#   expected_upcoming     doc_ids that must be listed in upcoming_changes
#   expected_conflict     a conflicts_detected[].resolved_by value that must be present
#   expected_meta         subset match on the response `meta` object (e.g. {cache_hit: true})
#   expected_guardrail    meta.guardrail must equal this value (or be one of a list)
#   session, turn         ordered conversation sharing one X-Session-Id per run (turns run in order, back to back)
#   repeat_of             re-ask that item's question verbatim (same student, as_of) right after it; inherits its expectations
#   requires_docs         skip (not scored) unless these doc_ids are indexed
#   reference             the expected answer in words (used by the LLM judge and by people reading the report)
#   difficulty            easy | medium | hard;  tags: free-form labels (reported per tag)

