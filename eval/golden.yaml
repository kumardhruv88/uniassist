# policy what-ifs on a stated percentage (decided by code from the rule registry: minimum and condonable shortage)
- id: CD4
  bucket: policy_fact
  question: "Can I sit the end-sem exam with 72% attendance?"
  as_of_date: "2026-10-06"
  expected_answer_type: retrieved_fact
  expected_facts: ["80", "10"]
  expected_tool: {name: check_attendance_value, input: {medical_certificate: false}, output: {result: CONDONABLE, minimum_pct: 80.0, lowest_with_condonation_pct: 70.0}}
  expected_sources: ["ACAD-2026-08#1", "ACAD-REG-2024#7.3"]
  reference: "Not by itself: 72% is below the 80% minimum (ACAD-2026-08 §1). The Dean may condone a shortage of up to 10% on medical grounds (ACAD-REG-2024 §7.3, kept by ACAD-2026-08 §2), so 72% is enough only if a medical condonation is approved; never for laboratory courses."
  difficulty: medium
  tags: [condonation, what_if, informal, attendance]

- id: CD5
  bucket: policy_fact
  question: "Is 85% attendance enough to appear for the end-semester exam?"
  as_of_date: "2026-10-06"
  expected_answer_type: retrieved_fact
  expected_facts: ["80"]
  expected_tool: {name: check_attendance_value, output: {result: MEETS_MINIMUM, minimum_pct: 80.0}}
  expected_sources: ["ACAD-2026-08#1"]
  reference: "Yes: 85% meets the 80% minimum (ACAD-2026-08 §1)."
  difficulty: easy
  tags: [what_if, attendance]

- id: CD6
  bucket: policy_fact
  question: "Is 70% attendance enough with a medical certificate?"
  as_of_date: "2026-10-06"
  expected_answer_type: retrieved_fact
  expected_facts: ["80", "10"]
  expected_tool: {name: check_attendance_value, input: {medical_certificate: true}, output: {result: CONDONABLE, minimum_pct: 80.0, lowest_with_condonation_pct: 70.0}}
  expected_sources: ["ACAD-2026-08#1", "ACAD-REG-2024#7.3"]
  reference: "Only with condonation: 70% is exactly the lowest level a 10% medical condonation reaches under the 80% minimum, so it is enough only if the Dean approves the condonation (not for laboratory courses)."
  difficulty: hard
  tags: [condonation, what_if, boundary, attendance]

