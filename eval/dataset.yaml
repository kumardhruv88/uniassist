# UniAssist evaluation set (guide §7). 37 questions with expected answer type, facts and sources.
# Corpus state: data/corpus/documents + the demo circular ACAD-2026-08 (80%, from 2026-08-01, replaces ACAD-REG-2024 §7.2).
# expected_facts: strings that must appear in answer + explanation (case-insensitive, commas ignored).
# expected_sources: doc_id#section the answer should cite (citation accuracy) and retrieve (hit rate).
# expected_tool: tool name + a subset of its output that must match exactly (tool-result correctness).

# ---- policy facts (6)
- {id: PF1, bucket: policy_fact, question: "What is the minimum attendance required to appear in end-semester exams?", as_of_date: "2026-10-06",
